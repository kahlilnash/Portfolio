<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casey Hall-Landers</title>
  <!-- Boxicons link for sleek modern menu icons -->
  <link href="https://unpkg.com" rel="stylesheet">
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* ==========================================================================
       FLOATING SIDEBAR NAVIGATION STYLES
       ========================================================================== */
    :root {
      --sb-width: 240px;
      --sb-collapsed: 68px;
    }

    /* Fixed overlay to sit perfectly on top of canvas graphics */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: var(--sb-width);
      background: rgba(20, 20, 25, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 20;
      /* Higher than canvas and overlay cards */
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      box-sizing: border-box;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      transition: opacity 0.2s ease;
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-size: 18px;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }

    .toggle-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .sidebar-nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar-nav li {
      margin-bottom: 8px;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #94a3b8;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .sidebar-nav a i {
      font-size: 20px;
      min-width: 20px;
    }

    .sidebar-nav a:hover,
    .sidebar-nav a.active {
      background: rgba(163, 230, 53, 0.1);
      /* Matches neon accent */
      color: #a3e635;
    }

    /* Collapsed state modifier overrides */
    .sidebar.collapsed {
      width: var(--sb-collapsed);
    }

    .sidebar.collapsed .brand {
      opacity: 0;
      pointer-events: none;
    }

    .sidebar.collapsed .sidebar-header {
      flex-direction: column-reverse;
      gap: 16px;
    }

    .sidebar.collapsed .nav-label {
      opacity: 0;
      pointer-events: none;
    }

    /* ==========================================================================
       EXISTING OVERLAY MODIFICATIONS
       ========================================================================== */
    #archive-overlay {
      position: absolute;
      top: 30px;
      /* Dynamic adjustment: pushes card to clear space alongside open menu */
      left: calc(var(--sb-width) + 30px);
      z-index: 10;
      background: rgba(20, 20, 25, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 24px;
      border-radius: 12px;
      color: #ffffff;
      width: 280px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease, left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Shift descriptive panel tightly leftwards if menu collapses */
    .sidebar.collapsed~#archive-overlay {
      left: calc(var(--sb-collapsed) + 30px);
    }

    #archive-overlay.active {
      pointer-events: auto;
      opacity: 1;
      transform: translateY(0);
    }

    #archive-overlay h1 {
      margin: 0 0 8px 0;
      font-size: 18px;
      font-weight: 600;
      color: #a3e635;
    }

    #archive-overlay p {
      margin: 0 0 20px 0;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    #archive-overlay button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 14px;
      border-radius: 6px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    #archive-overlay button:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Mobile Responsive Viewport Setup */
    @media (max-width: 768px) {
      .sidebar {
        left: calc(-1 * var(--sb-width));
      }

      .sidebar.open {
        left: 0;
        width: var(--sb-width);
      }

      .sidebar.open .nav-label {
        opacity: 1;
      }

      #archive-overlay {
        left: 30px !important;
        top: auto;
        bottom: 30px;
        width: calc(100% - 108px);
      }
    }
  </style>
</head>

<body>

  <!-- Overlay Navigation Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span>CHL // ARCHIVE</span>
      </div>
      <button class="toggle-btn" id="toggle-btn">
        <i class="bx bx-menu"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li>
          <a href="index.html">
            <i class="bx bx-network-chart"></i>
            <span class="nav-label">Node Map</span>
          </a>
        </li>
        <li>
          <a href="projects.html">
            <i class="bx bx-folder"></i>
            <span class="nav-label">Projects</span>
          </a>
        </li>
        <li>
          <a href="#">
            <i class="bx bx-info-circle"></i>
            <span class="nav-label">About Specs</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Fullscreen 3D Node Engine Window -->
  <canvas id="archiveCanvas"></canvas>

  <!-- Individual Node Detail Document Layer -->
  <div id="archive-overlay">
    <h1 id="page-title">Feature Node</h1>
    <p id="page-desc">Loading localized coordinate data parameters...</p>
    <button id="back-btn">Close Node</button>
  </div>

  <!-- JavaScript Toggle Engine Initialization -->
  <script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-btn');

    toggleBtn.addEventListener('click', () => {
      if (window.innerWidth > 768) {
        sidebar.classList.toggle('collapsed');
      } else {
        sidebar.classList.toggle('open');
      }
    });
  </script>
  <script src="script.js"></script>
</body>

</html>
