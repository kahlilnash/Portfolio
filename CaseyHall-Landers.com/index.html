<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Nodes Space</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000000;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>

  <!-- Three.js Library via CDN -->
  <script src="https://unpkg.com"></script>

  <script>
    // --- Configuration ---
    const NODE_COUNT = 150;
    const SPACE_SIZE = 400; // Size of the bounding area
    const MAX_DISTANCE = 80; // Distance threshold to draw a connection line

    // --- Setup Scene, Camera, and Renderer ---
    const scene = new THREE.Scene();
    // Add a subtle fog to make nodes fade beautifully into the distance
    // scene.fog = new THREE.FogExp2(0x000000, 0.002);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.z = 700;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- Create Nodes Data Structure ---
    const nodesData = [];
    const positions = new Float32Array(NODE_COUNT * 3);

    // Geometries for performance
    const nodeGeometry = new THREE.SphereGeometry(1.5, 8, 8);
    const nodeMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const instancedNodes = new THREE.InstancedMesh(nodeGeometry, nodeMaterial, NODE_COUNT);

    const dummy = new THREE.Object3D();

    for (let i = 0; i < NODE_COUNT; i++) {
      // Randomly scatter nodes within a 3D box region
      const x = (Math.random() - 0.5) * SPACE_SIZE;
      const y = (Math.random() - 0.5) * SPACE_SIZE;
      const z = (Math.random() - 0.5) * SPACE_SIZE;

      nodesData.push({
        x: x, y: y, z: z,
        // Assign unique offsets so they drift out-of-sync organically
        seedX: Math.random() * 100,
        seedY: Math.random() * 100,
        seedZ: Math.random() * 100,
        // Speed modifier per node
        speed: 0.1 + Math.random() * 0.2
      });
    }
    scene.add(instancedNodes);

    // --- Connection Lines Dynamic Geometry ---
    // We use a dynamic LineSegments configuration for optimal rendering speed
    const lineGeometry = new THREE.BufferGeometry();
    // The maximum possible connections is pairs combination, but we cap it to save memory
    const maxLines = NODE_COUNT * 4;
    const linePositions = new Float32Array(maxLines * 2 * 3); // 2 points per line, 3 coords per point
    const lineColors = new Float32Array(maxLines * 2 * 3);

    lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
    lineGeometry.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));

    const lineMaterial = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const lineSegments = new THREE.LineSegments(lineGeometry, lineMaterial);
    scene.add(lineSegments);

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();
      let lineIndex = 0;
      const linePosAttr = lineGeometry.attributes.position;
      const lineColAttr = lineGeometry.attributes.color;

      // 1. Update Node Positions (Floating Logic)
      for (let i = 0; i < NODE_COUNT; i++) {
        const node = nodesData[i];

        // Use trigonometry layers to simulate pseudo-random Perlin noise drifting
        node.x += Math.sin(elapsedTime * node.speed + node.seedX) * 0.2;
        node.y += Math.cos(elapsedTime * node.speed + node.seedY) * 0.2;
        node.z += Math.sin(elapsedTime * node.speed + node.seedZ) * 0.2;

        // Slowly rotate the nodes in a gentle arc
        dummy.position.set(node.x, node.y, node.z);
        dummy.updateMatrix();
        instancedNodes.setMatrixAt(i, dummy.matrix);
      }
      instancedNodes.instanceMatrix.needsUpdate = true;

      // 2. Calculate Distances & Generate Proximity Lines
      for (let i = 0; i < NODE_COUNT; i++) {
        const nodeA = nodesData[i];

        for (let j = i + 1; j < NODE_COUNT; j++) {
          const nodeB = nodesData[j];

          const dx = nodeA.x - nodeB.x;
          const dy = nodeA.y - nodeB.y;
          const dz = nodeA.z - nodeB.z;
          const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

          // Check if nodes are close enough to form a bond
          if (dist < MAX_DISTANCE && lineIndex < maxLines) {
            const alpha = 1.0 - (dist / MAX_DISTANCE); // Shorter distance = brighter line

            // Segment Start (Node A)
            linePosAttr.setXYZ(lineIndex * 2, nodeA.x, nodeA.y, nodeA.z);
            lineColAttr.setXYZ(lineIndex * 2, alpha, alpha, alpha);

            // Segment End (Node B)
            linePosAttr.setXYZ(lineIndex * 2 + 1, nodeB.x, nodeB.y, nodeB.z);
            lineColAttr.setXYZ(lineIndex * 2 + 1, alpha, alpha, alpha);

            lineIndex++;
          }
        }
      }

      // Tell Three.js to re-render the updated line points
      lineGeometry.setDrawRange(0, lineIndex * 2);
      linePosAttr.needsUpdate = true;
      lineColAttr.needsUpdate = true;

      // Slow camera spin to elevate the "floating in an archive" feel
      camera.position.x = Math.sin(elapsedTime * 0.05) * 300;
      camera.position.z = Math.cos(elapsedTime * 0.05) * 300;
      camera.lookAt(scene.position);

      renderer.render(scene, camera);
    }

    // --- Handle Responsive Window Resizing ---
    window.addEventListener('resize', onWindowResize, false);

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Initialize Animation
    animate();
  </script>
</body>

</html>
