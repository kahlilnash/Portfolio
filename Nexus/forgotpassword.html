<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password?</title>
</head>

<body>
    <style>
        h1 {
            padding-left: 20px;
            padding-top: 20px;
        }

        p {
            padding-left: 10px;
        }

        form {
            padding-left: 10px;
        }

        input {
            border: 2px solid #ccc;
            /* Defines the thickness and color of the border */
            border-radius: 8px;
            /* This rounds the corners */
            padding-left: 10px;
            /* Adds space inside the box so text isn't cramped */
            outline: none;
            /* Removes the default focus outline */
        }

        .padding {
            margin-bottom: 12px;
        }
    </style>
    <h1>Find your account</h1>
    <br>
    <p>Enter your email and we'll send you a link to reset your password.</p>
    <br>
    <form action="" method="post">
        <input type="email" class="padding" placeholder="Email" name="email" required>
        <br>
        <input type="submit" value="Submit">
    </form>
</body>

</html>
